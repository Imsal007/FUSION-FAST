<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter Display"; src: url("assets/InterDisplay-Black.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Inter"; src: url("assets/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/Inter-Bold.woff2") format("woff2"); font-weight: 700; }
      :root { --red: #e0231b; --deep: #8f0f0a; --cream: #f4f1ea; --ink: #141414; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--red); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      .bg { position: absolute; inset: 0; background: radial-gradient(90% 60% at 30% 25%, #ff3b2f 0%, var(--red) 45%, var(--deep) 100%); }
      .leak { position: absolute; width: 1400px; height: 1400px; left: -300px; top: -500px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 214, 160, 0.55) 0%, rgba(255, 140, 90, 0.18) 35%, transparent 65%); mix-blend-mode: screen; }
      .dish { position: absolute; width: 520px; filter: drop-shadow(0 50px 50px rgba(60, 0, 0, 0.55)); }
      .dish.a { left: 640px; top: 1080px; }
      .dish.b { left: -120px; top: 1180px; width: 420px; }
      .safe { position: absolute; left: 100px; right: 170px; top: 300px; }
      .logo-wrap { position: relative; width: 250px; height: 121px; margin-bottom: 76px; }
      .logo { position: absolute; inset: 0; width: 250px; }
      .glow { position: absolute; left: -90px; top: -120px; width: 430px; height: 360px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 240, 220, 0.5) 0%, transparent 65%); }
      .line { overflow: hidden; padding-bottom: 28px; margin-bottom: -18px; }
      .word { display: block; font-family: "Inter Display", sans-serif; font-weight: 900; font-size: 158px; line-height: 0.92;
        letter-spacing: -0.045em; color: var(--cream); }
      .word.ink { color: var(--ink); }
      .shimmer { position: relative; display: inline-block; }
      .shimmer .sweep { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay;
        background: linear-gradient(115deg, transparent 0%, transparent calc(var(--pos, -30%) - 14%), rgba(255, 255, 255, 0.85) var(--pos, -30%), transparent calc(var(--pos, -30%) + 14%), transparent 100%); }
      .sub { margin-top: 40px; max-width: 780px; font-size: 44px; line-height: 1.32; color: rgba(244, 241, 234, 0.92); }
      .pill { margin-top: 56px; display: inline-flex; align-items: center; gap: 18px; padding: 28px 50px; border-radius: 999px;
        background: var(--cream); color: var(--ink); font-weight: 700; font-size: 54px; box-shadow: 0 30px 60px -20px rgba(60, 0, 0, 0.6); }
      .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--red); }
      .bar { position: absolute; left: 0; bottom: 0; height: 12px; width: 100%; background: var(--cream); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6" data-width="1080" data-height="1920">
      <div class="bg"></div>
      <div class="leak" id="leak"></div>
      <img class="dish a" id="dishA" src="assets/cinder-and-bun.webp" alt="" />
      <img class="dish b" id="dishB" src="assets/saffron-lane.webp" alt="" />
      <div class="safe">
        <div class="logo-wrap">
          <div class="glow" id="glow"></div>
          <img class="logo" id="logo" src="assets/logo-cream.png" alt="SAL Digital" />
        </div>
        <div class="line" data-layout-allow-overflow><span class="word" id="w1">Get your</span></div>
        <div class="line" data-layout-allow-overflow><span class="word ink shimmer" id="w2">free demo<span class="sweep" id="sweep"></span></span></div>
        <div class="sub" id="sub">Free. No card. No contract.</div>
        <div class="pill" id="pill"><span class="dot"></span>saldigital.co</div>
      </div>
      <div class="bar" id="bar"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // light leak drifts across the whole card
      tl.fromTo("#leak", { x: -200, y: -100, opacity: 0.4 }, { x: 520, y: 260, opacity: 0.9, duration: 3.6, ease: "none" }, 0);
      // logo wipes in with a bloom behind it
      tl.fromTo("#logo", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.05);
      tl.fromTo("#glow", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.15, duration: 0.45, ease: "power2.out" }, 0.25);
      tl.fromTo("#glow", { opacity: 1 }, { opacity: 0.35, duration: 0.8, ease: "power1.inOut" }, 0.7);
      // headline rises out of its mask, line by line
      tl.fromTo("#w1", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power4.out" }, 0.3);
      tl.fromTo("#w2", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power4.out" }, 0.42);
      // a single light pass across "free demo"
      tl.fromTo("#sweep", { "--pos": "-30%" }, { "--pos": "130%", duration: 0.9, ease: "power2.inOut" }, 1.1);
      // supporting line, then the URL capsule pops
      tl.fromTo("#sub", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.85);
      tl.fromTo("#pill", { scale: 0.7, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, 1.25);
      tl.fromTo("#pill", { scale: 1 }, { scale: 1.035, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.85);
      // dishes float up from below the safe area
      tl.fromTo("#dishA", { y: 420, rotation: 12, opacity: 0 }, { y: 0, rotation: -6, opacity: 1, duration: 1.0, ease: "power3.out" }, 0.55);
      tl.fromTo("#dishB", { y: 460, rotation: -14, opacity: 0 }, { y: 0, rotation: 8, opacity: 1, duration: 1.0, ease: "power3.out" }, 0.7);
      tl.fromTo("#dishA", { y: 0 }, { y: -26, duration: 2.0, ease: "sine.inOut" }, 1.55);
      tl.fromTo("#dishB", { y: 0 }, { y: -18, duration: 2.0, ease: "sine.inOut" }, 1.7);
      // progress bar fills over the card
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 3.6, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
